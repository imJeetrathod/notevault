  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="1.5"/>
  <!-- note page with a folded corner -->
  <path d="M21 13h17.5L49 23.5V47a4.5 4.5 0 0 1-4.5 4.5h-23.5A4.5 4.5 0 0 1 16.5 47V17.5A4.5 4.5 0 0 1 21 13z" fill="url(#page)"/>
